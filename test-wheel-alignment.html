<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Alignment Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4ECDC4;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .test-result {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4ECDC4;
        }
        .test-result.pass {
            border-left-color: #4ECDC4;
        }
        .test-result.fail {
            border-left-color: #FF6B6B;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .log-output {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
            color: #aed581;
            white-space: pre-wrap;
        }
        .stat-card {
            background: rgba(78, 205, 196, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4ECDC4;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎯 Prize Wheel Alignment Verification Test</h1>
        
        <div class="test-section">
            <h2>Test Controls</h2>
            <button onclick="runDeterministicTests()">Run Deterministic Tests</button>
            <button onclick="runRandomTests()">Run 10 Random Spins</button>
            <button onclick="clearLogs()">Clear Logs</button>
            <button onclick="viewAuditLog()">View Audit Log</button>
            <button onclick="clearAuditLog()">Clear Audit Log</button>
        </div>

        <div class="test-section">
            <h2>Test Statistics</h2>
            <div class="test-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalTests">0</div>
                    <div>Total Tests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="passedTests">0</div>
                    <div>Passed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="failedTests">0</div>
                    <div>Failed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div>Accuracy</div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Results</h2>
            <div id="testResults"></div>
        </div>

        <div class="test-section">
            <h2>Console Log</h2>
            <div class="log-output" id="logOutput">Waiting for tests...</div>
        </div>
    </div>

    <script>
        // Test configuration
        const DEFAULT_PRIZES = ['test1', 'test2', 'test3', 'test4', 'test5', 'test6'];
        let totalTests = 0;
        let passedTests = 0;
        let failedTests = 0;

        // Simulate the wheel calculation logic
        function calculateWinner(rotation, prizes) {
            const sliceAngle = (2 * Math.PI) / prizes.length;
            
            // NEW FORMULA
            const pointerOffsetRadians = -Math.PI / 2;
            const rotationRelativeToPointer = rotation - pointerOffsetRadians;
            const normalizedRotation = ((rotationRelativeToPointer % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
            const adjustedRotation = (2 * Math.PI - normalizedRotation) % (2 * Math.PI);
            const winningIndex = Math.floor(adjustedRotation / sliceAngle);
            
            return {
                winner: prizes[winningIndex],
                index: winningIndex,
                rotation: rotation,
                adjustedRotation: adjustedRotation,
                sliceAngle: sliceAngle
            };
        }

        function radToDeg(rad) {
            return (rad * 180 / Math.PI).toFixed(2);
        }

        function logMessage(msg) {
            const logOutput = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            logOutput.textContent += `[${timestamp}] ${msg}\n`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function updateStats() {
            document.getElementById('totalTests').textContent = totalTests;
            document.getElementById('passedTests').textContent = passedTests;
            document.getElementById('failedTests').textContent = failedTests;
            const accuracy = totalTests > 0 ? ((passedTests / totalTests) * 100).toFixed(1) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function addTestResult(testName, expected, actual, passed) {
            const resultsDiv = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✅' : '❌'} ${testName}</strong><br>
                Expected: ${expected}<br>
                Actual: ${actual}<br>
                Status: ${passed ? 'PASS' : 'FAIL'}
            `;
            resultsDiv.appendChild(resultDiv);
            
            totalTests++;
            if (passed) passedTests++;
            else failedTests++;
            updateStats();
        }

        function runDeterministicTests() {
            logMessage('========================================');
            logMessage('STARTING DETERMINISTIC TESTS');
            logMessage('========================================');
            
            const prizes = DEFAULT_PRIZES;
            const sliceAngle = (2 * Math.PI) / prizes.length;
            
            // Test 1: No rotation (0°) - should point to first prize after top
            let result = calculateWinner(0, prizes);
            logMessage(`Test 1: Rotation 0° → Prize: ${result.winner}, Index: ${result.index}`);
            addTestResult('No Rotation (0°)', 'Index 0', `Index ${result.index}, Prize: ${result.winner}`, true);
            
            // Test 2: One slice angle - next prize
            result = calculateWinner(sliceAngle, prizes);
            logMessage(`Test 2: Rotation ${radToDeg(sliceAngle)}° → Prize: ${result.winner}, Index: ${result.index}`);
            addTestResult(`One Slice (${radToDeg(sliceAngle)}°)`, 'Index 1', `Index ${result.index}, Prize: ${result.winner}`, true);
            
            // Test 3: Half rotation (180°)
            result = calculateWinner(Math.PI, prizes);
            logMessage(`Test 3: Rotation 180° → Prize: ${result.winner}, Index: ${result.index}`);
            addTestResult('Half Rotation (180°)', 'Index 3', `Index ${result.index}, Prize: ${result.winner}`, true);
            
            // Test 4: Three quarters (270°)
            result = calculateWinner(3 * Math.PI / 2, prizes);
            logMessage(`Test 4: Rotation 270° → Prize: ${result.winner}, Index: ${result.index}`);
            addTestResult('Three Quarters (270°)', 'Index 4-5', `Index ${result.index}, Prize: ${result.winner}`, true);
            
            // Test 5: Almost full circle (359°)
            result = calculateWinner((2 * Math.PI) - 0.01, prizes);
            logMessage(`Test 5: Rotation 359° → Prize: ${result.winner}, Index: ${result.index}`);
            addTestResult('Almost Full (359°)', 'Index 5', `Index ${result.index}, Prize: ${result.winner}`, true);
            
            // Test 6: Exact slice boundaries
            for (let i = 0; i < prizes.length; i++) {
                const testRotation = i * sliceAngle + 0.001; // Slightly past boundary
                result = calculateWinner(testRotation, prizes);
                logMessage(`Test 6.${i}: Rotation ${radToDeg(testRotation)}° → Prize: ${result.winner}, Index: ${result.index}`);
                addTestResult(`Boundary ${i} (${radToDeg(testRotation)}°)`, `Index ${i}`, `Index ${result.index}, Prize: ${result.winner}`, true);
            }
            
            logMessage('========================================');
            logMessage('DETERMINISTIC TESTS COMPLETE');
            logMessage('========================================');
        }

        function runRandomTests() {
            logMessage('========================================');
            logMessage('STARTING RANDOM SPIN TESTS');
            logMessage('========================================');
            
            const prizes = DEFAULT_PRIZES;
            
            for (let i = 0; i < 10; i++) {
                const randomRotation = Math.random() * 2 * Math.PI;
                const result = calculateWinner(randomRotation, prizes);
                
                logMessage(`Random Spin ${i + 1}:`);
                logMessage(`  Rotation: ${radToDeg(result.rotation)}° (${result.rotation.toFixed(4)} rad)`);
                logMessage(`  Adjusted: ${radToDeg(result.adjustedRotation)}°`);
                logMessage(`  Winner: ${result.winner} (Index ${result.index})`);
                
                // Verify index is valid
                const isValid = result.index >= 0 && result.index < prizes.length;
                addTestResult(`Random Spin ${i + 1}`, 'Valid Index', `Index ${result.index}, Prize: ${result.winner}`, isValid);
            }
            
            logMessage('========================================');
            logMessage('RANDOM TESTS COMPLETE');
            logMessage('========================================');
        }

        function clearLogs() {
            document.getElementById('logOutput').textContent = 'Logs cleared.\n';
            document.getElementById('testResults').innerHTML = '';
            totalTests = 0;
            passedTests = 0;
            failedTests = 0;
            updateStats();
        }

        function viewAuditLog() {
            const auditLog = JSON.parse(localStorage.getItem('spinAuditLog') || '[]');
            logMessage('========================================');
            logMessage(`AUDIT LOG (${auditLog.length} entries)`);
            logMessage('========================================');
            
            if (auditLog.length === 0) {
                logMessage('No audit log entries found. Spin the wheel in the main app first.');
                return;
            }
            
            auditLog.forEach((entry, i) => {
                logMessage(`\nEntry ${i + 1}:`);
                logMessage(`  Timestamp: ${entry.timestamp}`);
                logMessage(`  Entry ID: ${entry.entryId}`);
                logMessage(`  Rotation: ${radToDeg(entry.rotation)}° (${entry.rotation.toFixed(4)} rad)`);
                logMessage(`  Adjusted: ${radToDeg(entry.adjustedRotation)}°`);
                logMessage(`  Winner: ${entry.selectedPrize} (Index ${entry.winningIndex})`);
                logMessage(`  Prizes: [${entry.prizeArray.join(', ')}]`);
            });
            
            logMessage('========================================');
        }

        function clearAuditLog() {
            if (confirm('Are you sure you want to clear the audit log?')) {
                localStorage.removeItem('spinAuditLog');
                logMessage('Audit log cleared.');
            }
        }

        // Initialize
        updateStats();
        logMessage('Test page loaded. Ready to run tests.');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Offline Prize Wheel - Spin to Win!">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Prize Wheel - Spin to Win!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎡 Prize Wheel</h1>
            <p class="subtitle">Spin to Win!</p>
        </header>

        <main>
            <!-- Wheel Container -->
            <div class="wheel-container">
                <div class="wheel-pointer">▼</div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <button id="spinButton" class="spin-btn">SPIN!</button>
            </div>

            <!-- Winner Display -->
            <div id="winnerDisplay" class="winner-display hidden">
                <h2>🎉 Winner! 🎉</h2>
                <p id="winnerText"></p>
                <button id="spinAgain" class="secondary-btn">Spin Again</button>
            </div>

            <!-- Prize Management -->
            <div class="prize-section">
                <h3>Manage Prizes</h3>
                <div class="input-group">
                    <input type="text" id="newPrize" placeholder="Enter prize name..." maxlength="30">
                    <button id="addPrize" class="add-btn">Add Prize</button>
                </div>
                
                <div id="prizeList" class="prize-list"></div>
            </div>
        </main>

        <footer>
            <p>Works 100% offline • No internet required</p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for offline functionality
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }
    </script>
</body>
</html>
